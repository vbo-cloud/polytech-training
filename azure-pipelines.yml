# Pipeline Azure DevOps des trois applications — build/test du worker .NET,
# infrastructure, publication des images dans l'ACR du projet, déploiement sur
# App Service.
#
# Une PR vers `dev` compile, teste et affiche le `plan` Terraform, sans rien
# créer ni déployer. Un merge sur `dev` applique le plan, pousse les images et
# déploie. Un seul environnement, `dev` (décision #13) : rien ne s'appelle
# « prod » ici.
#
# Build et Test ne couvrent que le worker .NET — `vote` (Python) et `result`
# (Node.js) n'ont pas de suite de tests à faire tourner ici. Les trois
# applications sont en revanche construites et déployées depuis ce dépôt : les
# fronts ne pointent plus le registre public d'Avisto (cf. CLAUDE.md, décision
# de scope #3, révisée).

trigger:
  branches:
    include:
      - dev
      - main
  # Un commit qui ne touche à aucune des trois applications ni à ce fichier ne
  # peut pas changer une image produite. Sans ce filtre, une correction de
  # README déclenche un build, un push d'image et un déploiement.
  paths:
    include:
      - worker/*
      - worker.Tests/*
      - vote/*
      - result/*
      - terraform/*
      - azure-pipelines.yml

# Les filtres de chemin ne s'héritent pas du déclencheur CI : sans cette
# répétition, une PR qui ne touche que le README lancerait le pipeline complet.
pr:
  branches:
    include:
      - dev
      - main
  paths:
    include:
      - worker/*
      - worker.Tests/*
      - vote/*
      - result/*
      - terraform/*
      - azure-pipelines.yml

pool:
  vmImage: ubuntu-latest

variables:
  # Le groupe ne contient qu'`azureServiceConnection`, le nom de la connexion
  # de service ARM. Les noms de ressources n'y sont **pas** : ils portent le
  # suffixe aléatoire tiré par Terraform à la création, donc ils changent à
  # chaque cycle `destroy` / `apply` — et le teardown entre deux sessions est
  # la routine documentée du projet. Recopiés à la main ici, ils seraient
  # périmés dès le premier teardown, et `Publish` échouerait sur un registre
  # qui n'existe plus. Le stage `Infra` les publie lui-même depuis
  # `terraform output`.
  #
  # Le groupe ne contient aucun secret, et c'est le résultat recherché :
  # l'authentification passe entièrement par la connexion de service ARM et par
  # l'identité managée de l'App Service. Il n'existe ni mot de passe de
  # registre — l'ACR a `admin_enabled = false` — ni chaîne de connexion à
  # transporter : Terraform les écrit directement dans les `app_settings`.
  # Le jour où un secret devient nécessaire, il entre ici, marqué « secret »,
  # jamais dans le YAML.
  - group: polytech-training-dev

  - name: dotnetVersion
    value: 8.0.x
  - name: workerProject
    value: worker/Worker.csproj
  - name: testProject
    value: worker.Tests/Worker.Tests.csproj
  - name: workerImageRepository
    value: polytech/worker
  - name: voteImageRepository
    value: polytech/vote
  - name: resultImageRepository
    value: polytech/result
  # Le tag identifie le run qui l'a produit. `latest` est proscrit ici comme
  # dans Terraform : il rend impossible de dire quelle version tourne.
  - name: imageTag
    value: $(Build.BuildId)
  # Le cache NuGet a besoin d'un dossier stable et connu des deux stages.
  - name: NUGET_PACKAGES
    value: $(Pipeline.Workspace)/.nuget/packages

stages:
  # ============================================================================
  - stage: Build
    displayName: Build
    jobs:
      - job: BuildWorker
        displayName: Compile the worker
        steps:
          - task: UseDotNet@2
            displayName: Install the .NET SDK
            inputs:
              packageType: sdk
              version: $(dotnetVersion)

          - task: Cache@2
            displayName: Restore the NuGet cache
            inputs:
              # La clé inclut les `.csproj` : toute modification de dépendance
              # invalide le cache, exactement comme un changement de
              # `requirements.txt` invalide un layer Docker.
              key: 'nuget | "$(Agent.OS)" | **/*.csproj'
              restoreKeys: |
                nuget | "$(Agent.OS)"
              path: $(NUGET_PACKAGES)

          # Les deux projets, pas seulement le worker. La clé de cache porte sur
          # `**/*.csproj` : ne restaurer que le worker enregistrerait un cache
          # sans xunit ni le SDK de test, et le stage Test obtiendrait un *hit*
          # sur cette même clé sans jamais pouvoir la compléter — les paquets de
          # test seraient retéléchargés à chaque run, indéfiniment.
          - task: DotNetCoreCLI@2
            displayName: Restore dependencies
            inputs:
              command: restore
              projects: |
                $(workerProject)
                $(testProject)

          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              command: build
              projects: |
                $(workerProject)
                $(testProject)
              arguments: --configuration Release --no-restore

  # ============================================================================
  - stage: Test
    displayName: Test
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: TestWorker
        displayName: Run the unit tests
        steps:
          - task: UseDotNet@2
            displayName: Install the .NET SDK
            inputs:
              packageType: sdk
              version: $(dotnetVersion)

          # Même clé qu'au stage Build, qui a restauré les deux projets : le
          # cache contient donc aussi les paquets de test, et le restore ne
          # retélécharge rien. C'est ce qui rend acceptable de ne pas transporter
          # d'artefact compilé entre les stages — la compilation est à refaire
          # ici de toute façon, seul le téléchargement est mutualisé.
          - task: Cache@2
            displayName: Restore the NuGet cache
            inputs:
              key: 'nuget | "$(Agent.OS)" | **/*.csproj'
              restoreKeys: |
                nuget | "$(Agent.OS)"
              path: $(NUGET_PACKAGES)

          - task: DotNetCoreCLI@2
            displayName: Test
            inputs:
              command: test
              projects: $(testProject)
              arguments: --configuration Release --logger trx
              publishTestResults: true

  # ============================================================================
  # `plan` sur une PR, `plan` puis `apply` sur un merge. La distinction tient
  # dans la condition du second pas : une PR montre ce qu'elle changerait,
  # un merge le fait.
  #
  # Le `plan` est enregistré dans un fichier et c'est **lui** qui est appliqué,
  # pas un second calcul. Un `apply` qui replanifie peut exécuter autre chose
  # que ce qui vient d'être relu, si l'infra a bougé entre les deux.
  #
  # Terraform n'est pas installé sur l'image `ubuntu-latest` — contrairement à
  # une hypothèse initiale de ce pipeline, invalidée par le premier run réel
  # (`terraform: command not found`). Installé explicitement ci-dessous, sans
  # extension de la marketplace, pour ne dépendre que de ce que l'organisation
  # Azure DevOps a déjà. Le `required_version` de `providers.tf` (`~> 1.9`)
  # fait échouer le stage si la version installée dérive hors de la plage
  # supportée, plutôt que de laisser passer une version inattendue.
  - stage: Infra
    displayName: Infrastructure
    dependsOn: Test
    condition: succeeded()
    variables:
      terraformVersion: 1.9.8
    jobs:
      - job: Terraform
        displayName: Plan and apply the infrastructure
        steps:
          - bash: |
              set -euo pipefail
              curl -fsSL -o /tmp/terraform.zip \
                "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
              sudo unzip -o /tmp/terraform.zip -d /usr/local/bin
              terraform -version
            displayName: Install Terraform

          # `addSpnToEnvironment` expose les identifiants du service principal
          # au script, qui les recopie dans les variables `ARM_*` attendues par
          # le provider. Sans ça, Terraform ne s'authentifie pas : la tâche
          # connecte `az`, pas le provider azurerm.
          - task: AzureCLI@2
            displayName: terraform init, validate and plan
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: terraform
              inlineScript: |
                set -euo pipefail
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_CLIENT_SECRET="$servicePrincipalKey"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                terraform init -input=false
                terraform fmt -check -recursive
                terraform validate
                terraform plan -input=false -out=tfplan

          - task: AzureCLI@2
            displayName: terraform apply
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: terraform
              inlineScript: |
                set -euo pipefail
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_CLIENT_SECRET="$servicePrincipalKey"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                # `init` est rejoué : le pas précédent l'a fait dans le même
                # espace de travail, mais le redire coûte quelques secondes et
                # évite de dépendre de cet état implicite.
                terraform init -input=false
                terraform apply -input=false -auto-approve tfplan

          # Les noms de ressources sont lus dans le state qui vient d'être
          # écrit, pas dans un groupe de variables tenu à la main : ils suivent
          # donc d'eux-mêmes un cycle destroy / apply. `isOutput=true` les rend
          # visibles des stages suivants, sous la forme
          # `stageDependencies.Infra.Terraform.outputs['tfOutputs.<nom>']`.
          # Pas `dependencies.Infra.outputs[...]` : cette forme ne s'évalue que
          # dans un `condition:`, jamais dans un bloc `variables:` — utilisée ici
          # par erreur, elle rendait `acrName` et les trois variables du stage
          # `Deploy` vides, jusqu'à l'échec réel `az acr build` qui l'a révélé.
          - task: AzureCLI@2
            name: tfOutputs
            displayName: Export the terraform outputs
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: terraform
              inlineScript: |
                set -euo pipefail
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_CLIENT_SECRET="$servicePrincipalKey"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                terraform init -input=false

                emit () {
                  value=$(terraform output -raw "$1")
                  echo "##vso[task.setvariable variable=$2;isOutput=true]$value"
                  echo "$2 = $value"
                }

                emit resource_group_name  resourceGroupName
                emit acr_name             acrName
                emit acr_login_server     acrLoginServer
                emit worker_web_app_name  workerWebAppName
                emit vote_web_app_name    voteWebAppName
                emit result_web_app_name  resultWebAppName

  # ============================================================================
  - stage: Publish
    displayName: Publish image
    # Sur `Infra` et non sur `Test` : l'ACR où pousser l'image est créé par
    # `terraform apply`. Sur une PR ce stage ne tourne pas de toute façon.
    dependsOn: Infra
    # Le nom du registre vient du state Terraform, pas du groupe de variables :
    # il change à chaque cycle destroy / apply.
    variables:
      acrName: $[ stageDependencies.Infra.Terraform.outputs['tfOutputs.acrName'] ]
    # Une validation de PR s'arrête après les tests. Sans cette garde, elle
    # pousserait une image et déploierait le worker depuis une branche que
    # personne n'a encore relue. L'approbation posée sur l'environnement ne
    # suffit pas à s'en protéger : elle obligerait quelqu'un à statuer sur
    # chaque PR, au lieu de ne jamais poser la question.
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: PublishWorkerImage
        displayName: Build and push the worker image
        steps:
          # `az acr build` plutôt que Docker@2 : le projet n'a qu'une connexion
          # de service ARM, et cette commande s'en contente. Docker@2 exigerait
          # une seconde connexion, de type Docker Registry, avec ses propres
          # identifiants à maintenir. Le build s'exécute côté ACR, donc sans
          # dépendre d'un démon Docker sur l'agent.
          #
          # L'image est reconstruite à partir de `worker/Dockerfile`, qui
          # recompile le projet en interne. C'est une redite assumée du stage
          # Build : ce Dockerfile est celui qui sert aussi au `docker compose`
          # local, et en maintenir une variante CI qui consommerait un artefact
          # ferait diverger l'image testée en local de celle déployée.
          #
          # Pas de `--file` : sa valeur par défaut ('Dockerfile') est jointe par
          # la CLI au contexte passé en dernier argument (`worker/Dockerfile`).
          # Un `--file` explicite suit une règle différente, contrairement à ce
          # que suggère l'aide de la commande (« relative path... to the source
          # code root folder », qui laisse croire qu'il est toujours relatif au
          # contexte) — la CLI le résout en réalité relatif à son propre
          # répertoire de travail. Constaté sur un run réel :
          # `--file Dockerfile` avec le contexte `worker/` cherchait
          # `./Dockerfile` à la racine du dépôt (répertoire de travail par
          # défaut de la tâche `AzureCLI@2`, aucun `workingDirectory` déclaré
          # ici), pas `worker/Dockerfile` — `ERROR: Unable to find 'Dockerfile'.`
          # Source : `_check_local_docker_file` dans
          # `azure/cli/command_modules/acr/build.py` (dépôt `Azure/azure-cli`).
          - task: AzureCLI@2
            displayName: az acr build
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr build \
                  --registry "$(acrName)" \
                  --image "$(workerImageRepository):$(imageTag)" \
                  worker/

      # Même commande, même raisonnement sur `--file` et sur la redite avec
      # les Dockerfiles locaux — voir les commentaires du job précédent.
      - job: PublishVoteImage
        displayName: Build and push the vote image
        steps:
          - task: AzureCLI@2
            displayName: az acr build
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr build \
                  --registry "$(acrName)" \
                  --image "$(voteImageRepository):$(imageTag)" \
                  vote/

      - job: PublishResultImage
        displayName: Build and push the result image
        steps:
          - task: AzureCLI@2
            displayName: az acr build
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr build \
                  --registry "$(acrName)" \
                  --image "$(resultImageRepository):$(imageTag)" \
                  result/

  # ============================================================================
  - stage: Deploy
    displayName: Deploy
    # Les deux dépendances comptent : `Publish` fournit l'image, `Infra`
    # fournit l'App Service qui la reçoit. `Infra` dépendant lui-même de
    # `Test`, un test rouge arrête toute la chaîne.
    dependsOn:
      - Infra
      - Publish
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      resourceGroupName: $[ stageDependencies.Infra.Terraform.outputs['tfOutputs.resourceGroupName'] ]
      acrLoginServer: $[ stageDependencies.Infra.Terraform.outputs['tfOutputs.acrLoginServer'] ]
      workerWebAppName: $[ stageDependencies.Infra.Terraform.outputs['tfOutputs.workerWebAppName'] ]
      voteWebAppName: $[ stageDependencies.Infra.Terraform.outputs['tfOutputs.voteWebAppName'] ]
      resultWebAppName: $[ stageDependencies.Infra.Terraform.outputs['tfOutputs.resultWebAppName'] ]
    jobs:
      # Déploiement direct sur l'application, sans slot intermédiaire. Le plan
      # App Service est en Basic, qui n'offre aucun deployment slot (décision
      # #11) : il n'y a donc rien à promouvoir, et le stage `Promote` qui
      # échangeait les slots a disparu avec lui.
      #
      # L'environnement `polytech-training-dev` sert d'abord à l'historique de
      # déploiement qu'Azure DevOps y tient. Une approbation manuelle peut y
      # être attachée depuis l'interface, mais aucune n'est requise : le projet
      # n'a qu'un environnement, et le merge sur `dev` vaut décision. Les
      # contrôles d'un environnement sont de toute façon évalués au démarrage
      # du stage, donc avant le job.
      #
      # Conséquence assumée du passage en Basic : le déploiement provoque un
      # redémarrage du conteneur, quelques secondes pendant lesquelles la file
      # `votes` n'est pas dépilée. Les votes s'y accumulent et sont traités au
      # redémarrage — rien n'est perdu, le front reste disponible. Un slot
      # supprimerait cette coupure ; il coûte le passage en Standard.
      - deployment: DeployWorker
        displayName: Deploy the worker
        environment: polytech-training-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: Deploy the image to the worker web app
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appName: $(workerWebAppName)
                    resourceGroupName: $(resourceGroupName)
                    containers: $(acrLoginServer)/$(workerImageRepository):$(imageTag)

      - deployment: DeployVote
        displayName: Deploy the vote front end
        environment: polytech-training-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: Deploy the image to the vote web app
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appName: $(voteWebAppName)
                    resourceGroupName: $(resourceGroupName)
                    containers: $(acrLoginServer)/$(voteImageRepository):$(imageTag)

      - deployment: DeployResult
        displayName: Deploy the result front end
        environment: polytech-training-dev
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  displayName: Deploy the image to the result web app
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appName: $(resultWebAppName)
                    resourceGroupName: $(resourceGroupName)
                    containers: $(acrLoginServer)/$(resultImageRepository):$(imageTag)
